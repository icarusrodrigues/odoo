services:
  db:
    image: postgres:15
    container_name: odoo_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    container_name: odoo_app
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./extra-addons:/mnt/extra-addons  # Adicionado para seus módulos
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_USER=odoo
      - DB_PASSWORD=odoo

volumes:
  db-data:
  odoo-data: